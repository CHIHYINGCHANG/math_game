<div class="wrap"><header><div><div class="eyebrow">MATH QUEST · VERSION 4.0</div><h1>🏝️ 國七數學闖關島</h1><p class="caption">解謎、尋寶、挑戰｜七年級全年原創題庫</p></div><div class="badge">⭐ <span id="totalStars">0</span> 星</div></header>
<div class="layout"><nav class="panel"><h2>📚 章節選擇</h2><div class="chapterList" id="chapterSelect"></div></nav>
<main><div class="hero"><div class="eyebrow">目前冒險區域</div><h2 id="chapterHeading"></h2><p>每章六關 · 過關解鎖下一關 · 最多十八顆星</p></div>
<div class="levels" id="levelMap"></div><section class="panel" id="gameBoard"></section></main>
<aside><section class="panel asidePanel"><h2>🏅 學習進度</h2><div class="metric" id="progressText"></div><div class="metric" id="accuracy"></div><p class="micro">答題正確率</p><div class="metric" id="mistakeCount"></div><p class="micro">錯題紀錄數</p></section>
<section class="panel asidePanel"><h2>💾 儲存與版本</h2><p class="foot">進度保存在這台裝置的瀏覽器。舊版 RPG 已備份到 GitHub 的 archive/rpg-v3.html。</p><button class="secondary reset" id="reset">清除 v4 進度</button><p class="foot">國七課程架構為原創練習安排，尚須依實際翰林教科書的年度及小節逐一核對。部分圖形題目前先以文字題實作。</p></section></aside></div></div>
<script>
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function fraction(a,b){if(b<0){a=-a;b=-b;}const g=gcd(a,b);return b/g===1?String(a/g):a/g+"/"+b/g;}
function generate(ch,d){
 const R=rand, x=R(3,12),y=R(2,9),z=R(1,8),k=R(2,6),n=R(-14,14),m=R(-10,10), t=R(0,3);
 let prompt="",ans=0,why="",hint="",topic="",custom=null;
 const signed=v=>v<0?"- "+Math.abs(v):"+ "+v;
 if(ch===0){
  if(d===0){
   if(t===0){ans=n+m;prompt="("+n+") + ("+m+") = ?";why=n+" + ("+m+") = "+ans;hint="先把加法轉換成數線上的移動。";topic="正負數的加減";}
   if(t===1){ans=n-m;prompt="("+n+") - ("+m+") = ?";why=n+" - ("+m+") = "+ans;hint="減去一個數，等於加上它的相反數。";topic="正負數的加減";}
   if(t===2){ans=Math.abs(n)-Math.abs(m);prompt="|"+n+"| - |"+m+"| = ?";why=Math.abs(n)+" - "+Math.abs(m)+" = "+ans;hint="先分別取絕對值。";topic="數與數線";}
   if(t===3){ans=n*m;prompt="("+n+") × ("+m+") = ?";why="依乘法符號規則，結果為 "+ans;hint="先看兩個數的正負號。";topic="正負數的乘除";}
  }else if(d===1){
   if(t===0){ans=n*m+z;prompt="("+n+") × ("+m+") + "+z+" = ?";why="先算乘法 "+(n*m)+"，再加 "+z+"，得到 "+ans;hint="先乘除後加減。";topic="整數混合運算";}
   if(t===1){ans=n*n-m*z;prompt="("+n+")² - ("+m+") × "+z+" = ?";why=(n*n)+" - ("+(m*z)+") = "+ans;hint="注意負數平方及運算順序。";topic="指數記法";}
   if(t===2){ans=Math.abs(n-m)+Math.abs(m);prompt="|"+n+" - ("+m+")| + |"+m+"| = ?";why="|"+(n-m)+"| + "+Math.abs(m)+" = "+ans;hint="先算絕對值符號裡的運算。";topic="絕對值與混合運算";}
   if(t===3){ans=n*m-z*k;prompt="("+n+") × ("+m+") - "+z+" × "+k+" = ?";why=(n*m)+" - "+(z*k)+" = "+ans;hint="先把兩組乘法算完。";topic="整數混合運算";}
  }else{
   if(t===0){ans=n*n-m*z+Math.abs(m);prompt="("+n+")² - ("+m+") × "+z+" + |"+m+"| = ?";why=(n*n)+" - ("+(m*z)+") + "+Math.abs(m)+" = "+ans;hint="注意平方、絕對值以及乘法優先順序。";topic="段考整數綜合題";}
   if(t===1){ans=(n-m)*k+Math.abs(n);prompt="["+n+" - ("+m+")] × "+k+" + |"+n+"| = ?";why="("+ (n-m) +") × "+k+" + "+Math.abs(n)+" = "+ans;hint="先去括號，再乘法，最後相加。";topic="段考整數綜合題";}
   if(t===2){ans=(n<0?-1:1)*Math.pow(Math.abs(n),2)-m;prompt="已知 a="+n+"，b="+m+"，求 a|a| - b。";why=n+" × "+Math.abs(n)+" - ("+m+") = "+ans;hint="a|a| 代表 a 乘以 a 的絕對值。";topic="數與代數綜合";}
   if(t===3){ans=(n-m)*(-z)+k;prompt="["+n+" - ("+m+")] × (-"+z+") + "+k+" = ?";why="("+ (n-m) +") × (-"+z+") + "+k+" = "+ans;hint="先算中括號，再判斷乘法的正負號。";topic="段考整數綜合題";}
  }
 }else if(ch===1){
  const a=x*k,b=y*k,g=gcd(a,b),l=a*b/g;
  if(d===0){
   if(t===0){ans=g;prompt=a+" 與 "+b+" 的最大公因數是？";why="列出共同因數，最大的是 "+g;hint="先做質因數分解。";topic="最大公因數";}
   if(t===1){ans=l;prompt=a+" 與 "+b+" 的最小公倍數是？";why=a+" × "+b+" ÷ "+g+" = "+l;hint="利用最大公因數與最小公倍數的關係。";topic="最小公倍數";}
   if(t===2){ans=2*x;prompt="將 "+(x*x)+" × "+(x*x)+" ÷ "+(x*x/x)+" 的指數部分簡化：若原式為 "+x+"² × "+x+"² ÷ "+x+"，數值是多少？";ans=x*x*x;why=x+"² × "+x+"² ÷ "+x+" = "+x+"³ = "+ans;hint="同底數相乘指數相加，除法指數相減。";topic="指數律";}
   if(t===3){ans=k*x;prompt="有 "+(k*x)+" 個物品，每 "+k+" 個裝一盒，裝滿後共有幾盒？";ans=x;why=(k*x)+" ÷ "+k+" = "+x;hint="使用除法計算盒數。";topic="因數與倍數";}
  }else if(d===1){
   if(t===0){ans=fraction(x+y,k);prompt=x+"/"+k+" + "+y+"/"+k+" = ?（最簡分數）";why="同分母相加後約分，得到 "+ans;hint="先將分子相加，再約分。";topic="分數四則運算";}
   if(t===1){ans=fraction(x*y,k*z);prompt=x+"/"+k+" × "+y+"/"+z+" = ?（最簡分數）";why="分子 "+x+"×"+y+"，分母 "+k+"×"+z+"，約分後為 "+ans;hint="先約分會比較容易。";topic="分數乘法";}
   if(t===2){ans=fraction(x*k-y*z,k*z);prompt=x+"/"+z+" - "+y+"/"+k+" = ?（最簡分數）";why="通分後分子為 "+(x*k)+" - "+(y*z)+"，約分得 "+ans;hint="先求兩分母的共同倍數。";topic="異分母分數減法";}
   if(t===3){ans=gcd(a,b);prompt="將 "+a+" 顆糖和 "+b+" 塊餅乾平均分成最多份完全相同、且沒有剩餘的禮物包，可分幾包？";why="最多份數等於 "+a+" 與 "+b+" 的最大公因數 "+ans;hint="這是最大公因數的生活應用。";topic="公因數應用";}
  }else{
   if(t===0){ans=fraction((x+y)*z,k*y);prompt="("+x+"/"+k+" + "+y+"/"+k+") × "+z+"/"+y+" = ?（最簡分數）";why="先同分母相加，得到 "+(x+y)+"/"+k+"，再乘以 "+z+"/"+y+"，結果為 "+ans;hint="先處理括號內，再做分數乘法。";topic="段考分數綜合";}
   if(t===1){ans=fraction(x*k*z-y*k*k,k*z*k);prompt=x+"/"+k+" - "+y+"/"+z+" × "+k+"/"+k+" = ?（最簡分數）";ans=fraction(x*z-y*k,k*z);why="先算乘法 "+y+"/"+z+" × 1，再通分，得 "+ans;hint="先乘除後加減，並觀察是否能約分。";topic="段考分數綜合";}
   if(t===2){ans=l;prompt="甲班每 "+a+" 天、乙班每 "+b+" 天舉辦活動，今天同時舉辦，至少再過幾天會同一天舉辦？";why="求 "+a+" 和 "+b+" 的最小公倍數，得到 "+l+" 天。";hint="找兩個周期共同出現的最短天數。";topic="公倍數生活題";}
   if(t===3){ans=fraction(x*z+y*k,k*z);prompt=x+"/"+k+" + "+y+"/"+z+" = ?（最簡分數）";why="通分得到 ("+(x*z)+"+"+(y*k)+")/"+(k*z)+"，約分為 "+ans;hint="分母不同，要先通分。";topic="段考分數綜合";}
  }
 }else if(ch===2){
  const sol=n,coef=k,off=m;
  if(d===0){
   ans=sol;prompt=coef+"x "+signed(off)+" = "+(coef*sol+off)+"，x = ?";why="移項後 "+coef+"x = "+(coef*sol)+"，所以 x = "+sol;hint="先將常數移到另一邊。";topic="解一元一次方程式";
  }else if(d===1){
   if(t<2){ans=sol;prompt=coef+"(x "+signed(off)+") = "+(coef*(sol+off))+"，x = ?";why="先除以 "+coef+"，得到 x "+signed(off)+" = "+(sol+off)+"，所以 x = "+sol;hint="先移除括號外的倍數。";topic="括號方程式";}
   else{ans=sol;prompt=coef+"x "+signed(off)+" = "+(coef-1)+"x "+signed(sol+off)+"，x = ?";why="兩邊消去 "+(coef-1)+"x，整理後 x = "+sol;hint="把含 x 的項集中在等式一側。";topic="移項與合併同類項";}
  }else{
   if(t<2){const price=R(8,35),qty=R(3,9),fee=R(10,60);ans=qty;prompt="每件商品 "+price+" 元，另收運費 "+fee+" 元。結帳總價 "+(price*qty+fee)+" 元，共買幾件？";why="設購買 x 件，"+price+"x + "+fee+" = "+(price*qty+fee)+"，解得 x = "+qty;hint="先將總價表示成『單價×數量＋運費』。";topic="一元一次應用題";}
   else{const age=R(11,18),gap=R(3,12);ans=age;prompt="哥哥比弟弟大 "+gap+" 歲，兩人年齡和為 "+(2*age+gap)+" 歲，弟弟幾歲？";why="設弟弟 x 歲，x + (x+"+gap+") = "+(2*age+gap)+"，得到 x = "+age;hint="設較小的年齡為未知數。";topic="年齡應用題";}
  }
 }else if(ch===3){
  const sx=R(-6,12),sy=R(-6,12),a=R(2,6),b=R(2,6);
  if(d===0){
   if(t<2){ans=a*sx+b*sy;prompt="若 x = "+sx+"、y = "+sy+"，"+a+"x + "+b+"y = ?";why=a+"×("+sx+") + "+b+"×("+sy+") = "+ans;hint="將 x、y 分別代入。";topic="二元一次式代入";}
   else{ans=sy;prompt="已知 "+a+"x + y = "+(a*sx+sy)+"，當 x = "+sx+" 時，y = ?";why="代入後 "+(a*sx)+" + y = "+(a*sx+sy)+"，因此 y = "+sy;hint="將已知 x 值代回原方程式。";topic="二元一次方程式";}
  }else if(d===1){
   ans=sx;prompt="聯立：x + y = "+(sx+sy)+"；"+a+"x + y = "+(a*sx+sy)+"。求 x。";why="兩式相減，得到 "+(a-1)+"x = "+((a-1)*sx)+"，所以 x = "+sx;hint="使用加減消去法，先消去 y。";topic="聯立方程式消去法";
  }else{
   if(t<2){const p=R(15,45),q=R(7,14),adult=R(4,12),child=R(3,9);ans=adult;prompt="某場活動成人票 "+p+" 元、學生票 "+q+" 元，共售出 "+(adult+child)+" 張，總收入 "+(p*adult+q*child)+" 元。成人票售出幾張？";why="設成人票 x、學生票 y：x+y="+(adult+child)+"，"+p+"x+"+q+"y="+(p*adult+q*child)+"，解得 x="+adult;hint="利用票數和金額列出二元一次聯立方程式。";topic="票價應用題";}
   else{ans=sy;prompt="已知 2x + 3y = "+(2*sx+3*sy)+"，5x + 3y = "+(5*sx+3*sy)+"。求 y。";why="兩式相減得到 3x="+(3*sx)+"，x="+sx+"；代回得到 y="+sy;hint="先用消去法求一個未知數。";topic="聯立方程式綜合";}
  }
 }else if(ch===4){
  const xx=R(-9,9),yy=R(-9,9),slope=R(2,6),intercept=R(-9,9);
  if(d===0){
   if(t<2){ans=xx>0?(yy>0?1:yy<0?4:0):(xx<0?(yy>0?2:yy<0?3:0):0);prompt="點 P("+xx+","+yy+") 位於第幾象限？若在坐標軸上則選 0。";why="根據 x、y 的正負號判斷象限，答案是 "+ans;hint="第一象限兩坐標皆正，依逆時針方向編號。";topic="直角坐標平面";}
   else{ans=yy;prompt="點 A("+xx+","+yy+") 的 y 坐標是多少？";why="有序數對的第二個數是 y 坐標："+yy;hint="點的坐標順序為 (x,y)。";topic="直角坐標平面";}
  }else if(d===1){
   ans=slope*xx+intercept;prompt="直線 y = "+slope+"x "+signed(intercept)+"，當 x = "+xx+" 時，y = ?";why=slope+"×("+xx+") "+signed(intercept)+" = "+ans;hint="把 x 代入直線方程式。";topic="二元一次方程式圖形";
  }else{
   if(t<2){ans=intercept;prompt="直線 "+slope+"x - y = "+(-intercept)+"，與 y 軸的交點 y 坐標是多少？";why="令 x=0，得到 -y="+(-intercept)+"，所以 y="+intercept;hint="與 y 軸相交的位置，其 x 坐標為 0。";topic="截距應用";}
   else{ans=slope;prompt="一條直線通過 (0,"+intercept+") 與 (2,"+(intercept+2*slope)+")，每當 x 增加 1，y 增加多少？";why="y 的變化量為 "+(2*slope)+"，x 變化 2，所以每 1 單位增加 "+slope;hint="比較兩個點的 x 與 y 變化量。";topic="直線與坐標推理";}
  }
 }else if(ch===5){
  if(d===0){
   ans=x*k;prompt="若 a:b = "+x+":"+y+"，且 b = "+(y*k)+"，則 a = ?";why="倍數為 "+k+"，所以 a="+x+"×"+k+"="+ans;hint="先確認 b 是比值中的幾倍。";topic="比例式";
  }else if(d===1){
   if(t<2){ans=x*k;prompt="y 與 x 成正比，x="+y+" 時 y="+(y*k)+"；當 x="+x+" 時，y = ?";why="比例常數為 "+k+"，因此 y="+k+"×"+x+"="+ans;hint="正比關係中 y/x 固定。";topic="正比";}
   else{ans=x*y;prompt="y 與 x 成反比，x="+k+" 時 y="+(x*y)+"；當 x="+(k)+" 時，x×y = ?";why="反比關係中乘積保持不變，因此為 "+(k*(x*y));ans=k*x*y;hint="反比關係中兩變數的乘積不變。";topic="反比";}
  }else{
   if(t<2){const item=R(3,9),price=R(6,20),need=R(10,25);ans=fraction(price*need,item);custom=null;prompt=item+" 件商品售價 "+price+" 元，若單價不變，購買 "+need+" 件需多少元？（最簡分數）";why="每件 "+price+"/"+item+" 元，買 "+need+" 件共 "+ans+" 元。";hint="這是正比；先找每件的價格。";topic="正比應用";}
   else{const workers=R(3,8),days=R(4,10),newWorkers=R(2,9);ans=fraction(workers*days,newWorkers);prompt=workers+" 人完成工作要 "+days+" 天，效率相同且工作量固定，改由 "+newWorkers+" 人完成，需幾天？（最簡分數）";why="人數×天數固定，得到 "+workers+"×"+days+"/"+newWorkers+" = "+ans+" 天。";hint="人數與天數成反比。";topic="反比應用";}
  }
 }else if(ch===6){
  const bound=R(-9,15),coef=R(2,7);
  if(d===0){
   ans=bound+1;prompt="x > "+bound+"，最小整數解為多少？";why="大於 "+bound+" 的最小整數是 "+ans;hint="嚴格大於不包含邊界值。";topic="不等式的整數解";
  }else if(d===1){
   ans=bound;prompt=coef+"x "+signed(m)+" ≥ "+(coef*bound+m)+"，求 x 的最小整數解。";why=coef+"x ≥ "+(coef*bound)+"，所以 x ≥ "+bound+"，最小整數解是 "+bound;hint="移項後除以正數，不等號方向不變。";topic="解一元一次不等式";
  }else{
   if(t<2){ans=bound+1;prompt="-"+coef+"x < "+(-coef*bound)+"，求最小整數解。";why="兩邊除以 -"+coef+"，不等號反向：x > "+bound+"，因此最小整數解為 "+(bound+1);hint="不等式除以負數時，記得改變不等號方向。";topic="不等式與負數";}
   else{const fee=R(10,60),unit=R(12,35),budget=R(130,250);ans=Math.floor((budget-fee)/unit);prompt="入場費 "+fee+" 元，每次遊戲另付 "+unit+" 元，預算不超過 "+budget+" 元，最多可玩幾次？";why="設次數 x，"+fee+"+"+unit+"x ≤ "+budget+"，所以 x ≤ "+((budget-fee)/unit)+"，最多 "+ans+" 次。";hint="先列出總費用不超過預算的不等式。";topic="生活不等式應用";}
  }
 }else if(ch===7){
  const list=[R(3,15),R(3,15),R(3,15),R(3,15),R(3,15)].sort((a,b)=>a-b),sum=list.reduce((a,b)=>a+b,0);
  if(d===0){
   ans=list[2];prompt="資料 "+list.join("、")+" 的中位數是多少？";why="排序後位於正中央的第三個數是 "+ans;hint="先由小到大排序。";topic="中位數";
  }else if(d===1){
   if(t<2){ans=sum/5;prompt="五筆成績 "+list.join("、")+"，平均數為多少？";why="總和 "+sum+"，除以 5 得 "+ans;hint="平均數等於總和除以筆數。";topic="平均數";}
   else{const a=R(4,12),b=R(1,9);ans=R(0,0)+a+b;prompt="甲班男生 "+a+" 人、女生 "+b+" 人，合計共有多少人？";why=a+"+"+b+"="+ans;hint="從列聯表兩類人數加總。";topic="列聯表";}
  }else{
   if(t<2){const avg=R(60,90),scores=[R(50,100),R(50,100),R(50,100),R(50,100)];ans=5*avg-scores.reduce((a,b)=>a+b,0);prompt="5 次考試平均 "+avg+" 分，其中 4 次分數是 "+scores.join("、")+"，第 5 次分數應為多少？（純代數計算）";why="總分應為 "+(5*avg)+"，扣除前四次 "+scores.reduce((a,b)=>a+b,0)+"，得到 "+ans;hint="平均數×筆數等於總和。";topic="平均數反推";}
   else{const a=R(3,9),b=R(3,9),c=R(3,9);ans=b;prompt="某統計表數值為 "+a+"、"+b+"、"+b+"、"+c+"、"+b+"，眾數是多少？";why=b+" 出現 3 次，因此是眾數。";hint="眾數是出現頻率最高的值。";topic="眾數";}
  }
 }else{
  if(d===0){
   ans=R(2,8);prompt="一個正方體有 6 個面。若有 "+ans+" 個互不重疊的正方體，全部共有多少個面？";why=ans+"×6="+(ans*6)+" 個面。";custom=[String(ans*6),String(ans*4),String(ans*5),String(ans*8)];ans=ans*6;hint="正方體共有 6 個平面。";topic="三視圖與立體圖形";
  }else if(d===1){
   if(t<2){ans=x;prompt="線對稱圖形上，點 P 與其對稱點 P' 到對稱軸距離相等。已知 P 到對稱軸距離 "+x+" 公分，P' 距離多少？";why="線對稱的對應點到對稱軸距離相等，所以為 "+ans+" 公分。";hint="利用線對稱的距離性質。";topic="線對稱";}
   else{ans=x*2;prompt="一個長方形沿著穿過中心且平行短邊的對稱軸對折，原本長度為 "+(x*2)+" 公分，對折後長邊方向長度多少？";ans=x;why="沿中央對折，長邊方向長度減半，得到 "+x;hint="中央對折會讓對折方向的尺寸減半。";topic="幾何對稱";}
  }else{
   if(t<2){const x1=R(-8,8),y1=R(-8,8),axis=R(-4,4);ans=2*axis-x1;prompt="點 P("+x1+","+y1+") 對直線 x="+axis+" 作鏡射，對應點 P' 的 x 坐標為何？";why="x 坐標對稱後為 2×"+axis+" - ("+x1+") = "+ans;hint="對稱軸是原點與對稱點連線的中垂線。";topic="坐標與線對稱";}
   else{const blocks=R(3,8);ans=blocks;prompt="積木由 "+blocks+" 個正方體沿同一直線排成一排，從正上方看可以看到幾個正方形？";why="每個正方體頂面各形成一格，因此可看到 "+ans+" 格。";hint="從上方觀察，只計算可見的頂面。";topic="三視圖";}
  }
 }
 const answer=String(ans);
 let options;
 if(custom){options=shuffle(custom);}
 else if(typeof ans==="number"&&Number.isFinite(ans)){
   const offsets=shuffle([-15,-10,-7,-4,-2,2,3,5,8,12,20]);
   options=shuffle([answer,...offsets.slice(0,3).map(v=>String(ans+v))]);
 }else{
   const parts=answer.split("/").map(Number),num=parts[0],den=parts[1];
   const pool=[answer];
   for(const alt of [fraction(num+1,den),fraction(num-1,den),fraction(num,den+1),fraction(num+2,den+1),String(num+1),String(num-1)]){
    if(alt!==answer&&!pool.includes(alt))pool.push(alt);
    if(pool.length===4)break;
   }
   options=shuffle(pool);
 }
 options=[...new Set(options)];
 while(options.length<4)options.push("其他 "+options.length);
 return {prompt,answer,options,why,hint,topic,signature:ch+"|"+prompt,difficulty:d,chapter:ch};
}

const CHAPTERS=[
["數與數線","🧭"],["標準分解式與分數運算","🔢"],["一元一次方程式","⚖️"],
["二元一次聯立方程式","🗝️"],["直角坐標與方程式圖形","📍"],["比例","🧪"],
["一元一次不等式","🚦"],["統計圖表與統計數據","📊"],["線對稱與三視圖","🪞"]
];
const LEVELS=[
["數線尋寶","數線定位","line","🎯"],["數字排序","從小到大排序","sort","🧩"],
["密碼寶箱","解開三位密碼","code","🔐"],["等式天平","找出缺少的數","balance","⚖️"],
["冰原迷宮","連續解開四個機關","maze","🧭"],["章節大挑戰","五題混合考驗","boss","🏆"]
];
const STORE="math-quest-puzzle-v4";
const $=id=>document.getElementById(id);
const fresh=()=>({chapter:0,unlockedChapter:0,stars:{},levelUnlock:{},attempts:0,correct:0,errors:[],bestCombo:0});
let state=fresh();
try{const raw=JSON.parse(localStorage.getItem(STORE));if(raw&&typeof raw==="object"){state={...fresh(),...raw};state.stars=state.stars||{};state.levelUnlock=state.levelUnlock||{};state.errors=Array.isArray(state.errors)?state.errors:[];}}catch(e){}
let currentLevel=null,questions=[],index=0,selected=null,mistakes=0,hints=0,finished=false,combo=0,sortPicks=[],notice="",showHint=false,answerFeedback="",reviewMode=false;
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function chapterKey(ch,lv){return ch+"-"+lv;}
function chapterUnlock(ch){return state.levelUnlock[ch]||0;}
function makeLine(){const target=rand(-8,8);return {kind:"line",title:"請在數線上找到 "+target,answer:String(target),hint:"0 的右邊是正數，左邊是負數。",why:"目標位置是 "+target+"。",topic:"正負數數線"};}
function makeSort(){const values=new Set();while(values.size<4)values.add(rand(-12,12));const sorted=[...values].sort((a,b)=>a-b);return {kind:"sort",title:"請依照從小到大排序",values:shuffle(sorted),answer:sorted.join(","),hint:"越靠數線左側的數越小，負數要特別小心。",why:"正確順序："+sorted.join(" < "),topic:"正負數比較"};}
function makeBalance(){const x=rand(-12,12),a=rand(-9,9),sum=x+a;return {kind:"input",title:"天平兩邊要相等：□ "+(a>=0?"+ "+a:"- "+Math.abs(a))+" = "+sum+"，□ = ?",answer:String(x),hint:"想想等式兩邊應該怎麼同時移動數字。",why:"□ = "+sum+" - ("+a+") = "+x,topic:"等式與整數運算"};}
function makeMath(ch,d){const q=generate(ch,d);return {kind:"choice",title:q.prompt,answer:q.answer,options:q.options.map(String),why:q.why,hint:q.hint,topic:q.topic};}
function makeQuestion(ch,lv,idx,exclude){
 if(ch===0){
  if(lv===0)return makeLine();
  if(lv===1)return makeSort();
  if(lv===3)return makeBalance();
 }
 const difficulty=lv<=1?0:lv<=3?1:2;
 for(let i=0;i<30;i++){const q=makeMath(ch,difficulty);if(!exclude.includes(q.title))return q;}
 return makeMath(ch,difficulty);
}
function totalSteps(lv){return [3,3,3,3,4,5][lv];}
function startLevel(lv){
 if(lv>chapterUnlock(state.chapter))return;
 currentLevel=lv;index=0;mistakes=0;hints=0;combo=0;selected=null;finished=false;reviewMode=false;notice="";answerFeedback="";showHint=false;questions=[];
 const used=[];for(let i=0;i<totalSteps(lv);i++){let q=makeQuestion(state.chapter,lv,i,used);questions.push(q);used.push(q.title);}
 render();
}
function chooseChapter(ch){
 if(ch>state.unlockedChapter)return;
 state.chapter=ch;currentLevel=null;finished=false;persist();render();
}
function verify(value){
 if(selected!==null||finished)return;
 const q=questions[index];const correct=String(value)===q.answer;
 selected=String(value);state.attempts++;
 if(correct){state.correct++;combo++;state.bestCombo=Math.max(state.bestCombo,combo);notice="✅ 答對了！"+(combo>=3?" 連續答對 "+combo+" 題！":"");}
 else{mistakes++;combo=0;notice="❌ 還差一點。正確答案："+(q.kind==="sort"?q.why:q.answer);state.errors.push({chapter:state.chapter,level:currentLevel,question:q.title,answer:q.answer,why:q.why});state.errors=state.errors.slice(-120);}
 answerFeedback=q.why;persist();render();
}
function advance(){
 if(selected===null)return;
 if(index+1<questions.length){index++;selected=null;notice="";answerFeedback="";showHint=false;sortPicks=[];render();}
 else{finishLevel();}
}
function finishLevel(){
 finished=true;
 const stars=mistakes===0&&hints===0?3:mistakes<=1&&hints<=1?2:1;
 const key=chapterKey(state.chapter,currentLevel);state.stars[key]=Math.max(stars,state.stars[key]||0);
 if(currentLevel<5)state.levelUnlock[state.chapter]=Math.max(chapterUnlock(state.chapter),currentLevel+1);
 if(currentLevel===5&&state.chapter<CHAPTERS.length-1)state.unlockedChapter=Math.max(state.unlockedChapter,state.chapter+1);
 persist();render();
}
function numStars(ch,lv){return state.stars[chapterKey(ch,lv)]||0;}
function renderMap(){
 $("chapterSelect").innerHTML=CHAPTERS.map((c,i)=>'<button class="chapter '+(state.chapter===i?'on':'')+'" data-ch="'+i+'" '+(i>state.unlockedChapter?'disabled':'')+'><span>'+c[1]+'</span><div><strong>'+(i<3?'七上':'七下')+' · '+escapeHTML(c[0])+'</strong><small>'+(i>state.unlockedChapter?'🔒 尚未解鎖':"已獲得 "+[0,1,2,3,4,5].reduce((s,n)=>s+numStars(i,n),0)+" / 18 星")+'</small></div></button>').join("");
 document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>chooseChapter(Number(b.dataset.ch)));
 $("levelMap").innerHTML=LEVELS.map((x,i)=>'<button class="level '+(i>chapterUnlock(state.chapter)?'locked':'')+' '+(currentLevel===i?'on':'')+'" data-lv="'+i+'" '+(i>chapterUnlock(state.chapter)?'disabled':'')+'><span class="lvl-emoji">'+x[3]+'</span><strong>第 '+(i+1)+' 關 · '+x[0]+'</strong><small>'+x[1]+'</small><span class="stars">'+(numStars(state.chapter,i)?"★".repeat(numStars(state.chapter,i))+"☆".repeat(3-numStars(state.chapter,i)):(i>chapterUnlock(state.chapter)?"🔒":"○ ○ ○"))+'</span></button>').join("");
 document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>startLevel(Number(b.dataset.lv)));
 const stars=Object.values(state.stars).reduce((s,n)=>s+n,0);
 $("totalStars").textContent=stars;
 $("accuracy").textContent=state.attempts?Math.round(state.correct/state.attempts*100)+"%":"0%";
 $("mistakeCount").textContent=state.errors.length;
 $("progressText").textContent="已完成 "+Object.keys(state.stars).length+" / "+(CHAPTERS.length*6)+" 關";
 $("chapterHeading").textContent=CHAPTERS[state.chapter][1]+" "+CHAPTERS[state.chapter][0];
}
function renderQuestion(){
 const board=$("gameBoard");
 if(currentLevel===null){board.innerHTML='<div class="empty"><div class="big-icon">🗺️</div><h2>選一個關卡，開始解謎！</h2><p>不再扣怪物血：每一關都有不同任務，答對才能前進。</p><button id="quickStart" class="primary">開始第 '+(chapterUnlock(state.chapter)+1)+' 關 →</button></div>';$("quickStart").onclick=()=>startLevel(chapterUnlock(state.chapter));return;}
 if(finished){
  const stars=numStars(state.chapter,currentLevel);
  board.innerHTML='<div class="empty"><div class="big-icon">🎉</div><p class="eyebrow">關卡完成</p><h2>'+LEVELS[currentLevel][0]+' 過關！</h2><div class="huge-stars">'+"★".repeat(stars)+"☆".repeat(3-stars)+'</div><p>答錯 '+mistakes+' 次 · 使用提示 '+hints+' 次</p><div class="action-row"><button class="secondary" id="replay">重新挑戰</button><button class="primary" id="goNext">'+(currentLevel===5?'返回地圖':'下一關 →')+'</button></div></div>';
  $("replay").onclick=()=>startLevel(currentLevel);$("goNext").onclick=()=>{if(currentLevel<5)startLevel(currentLevel+1);else{currentLevel=null;render();}};return;
 }
 const q=questions[index];
 let fragment="";
 if(q.kind==="line"){
  fragment='<div class="line-grid">'+Array.from({length:21},(_,i)=>{const n=i-10;return '<button class="tick '+(selected!==null&&String(n)===q.answer?'right':selected===String(n)?'wrong':'')+'" data-num="'+n+'" '+(selected!==null?'disabled':'')+'><b>●</b><small>'+n+'</small></button>';}).join("")+'</div>';
 }else if(q.kind==="sort"){
  fragment='<p class="micro">依序點選數字卡片，由小到大排出正確順序：</p><div class="choices">'+q.values.filter(v=>!sortPicks.includes(v)).map(v=>'<button class="answer" data-sort="'+v+'" '+(selected!==null?'disabled':'')+'>'+v+'</button>').join("")+'</div><div class="sort-result">'+(sortPicks.length?sortPicks.join("　→　"):"等待選擇第一個數字…")+'</div>'+(selected===null?'<button id="clearSort" class="secondary">重排</button>':'');
 }else if(q.kind==="input"){
  fragment='<form id="numberForm" class="input-line"><input aria-label="輸入答案" id="numberAnswer" type="number" step="any" placeholder="輸入數字" '+(selected!==null?'disabled':'required')+'><button type="submit" class="primary" '+(selected!==null?'disabled':'')+'>確認答案</button></form>';
 }else{
  fragment='<div class="choices">'+q.options.map((v,i)=>'<button class="answer '+(selected!==null&&String(v)===q.answer?'right':selected===String(v)?'wrong':'')+'" data-val="'+escapeHTML(v)+'" '+(selected!==null?'disabled':'')+'><small>'+("ABCD"[i])+'</small>'+escapeHTML(v)+'</button>').join("")+'</div>';
 }
 board.innerHTML='<div class="task-top"><span class="eyebrow">第 '+(currentLevel+1)+' 關 · '+LEVELS[currentLevel][0]+'</span><span>題目 '+(index+1)+' / '+questions.length+'</span></div><div class="step-track">'+questions.map((_,i)=>'<span class="'+(i<=index?'filled':'')+'"></span>').join("")+'</div><div class="topic">'+escapeHTML(q.topic)+'</div><h2 class="question">'+escapeHTML(q.title)+'</h2>'+fragment+'<div class="action-row"><button class="secondary" id="hint">💡 '+(showHint?'收起提示':'查看提示')+'</button><button class="secondary" id="exit">返回地圖</button></div>'+(showHint?'<div class="feedback">'+escapeHTML(q.hint)+'</div>':'')+(selected!==null?'<div class="feedback '+(selected===q.answer?'success':'error')+'"><strong>'+escapeHTML(notice)+'</strong><p>'+escapeHTML(answerFeedback)+'</p></div><button id="advance" class="primary full">'+(index+1===questions.length?'完成關卡':'繼續下一題 →')+'</button>':'');
 board.querySelectorAll("[data-num]").forEach(b=>b.onclick=()=>verify(b.dataset.num));
 board.querySelectorAll("[data-val]").forEach(b=>b.onclick=()=>verify(b.dataset.val));
 board.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{sortPicks.push(Number(b.dataset.sort));if(sortPicks.length===q.values.length)verify(sortPicks.join(","));else renderQuestion();});
 const clr=$("clearSort");if(clr)clr.onclick=()=>{sortPicks=[];renderQuestion();};
 const form=$("numberForm");if(form)form.onsubmit=e=>{e.preventDefault();const input=$("numberAnswer").value;if(input!=="")verify(Number(input));};
 $("hint").onclick=()=>{if(!showHint&&selected===null)hints++;showHint=!showHint;renderQuestion();};
 $("exit").onclick=()=>{currentLevel=null;selected=null;sortPicks=[];render();};
 const next=$("advance");if(next)next.onclick=advance;
}
function render(){renderMap();renderQuestion();}
$("reset").onclick=()=>{if(!confirm("確定要清除 v4 闖關紀錄？"))return;state=fresh();currentLevel=null;selected=null;sortPicks=[];finished=false;persist();render();};
render();

</script></body></html>
